name: hourly

on:
  schedule:
    # :20 every hour (UTC). FIRMS NRT usually lands within ~3 h of overpass. GitHub may
    # delay scheduled runs under load; a run takes ~15 min, mostly the 3D share renders.
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "hours to (re)compute"
        default: "1"

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Snapshot history (last 24 h) and the FIRMS/wind cache live between runs here.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/cache
            web/public/data
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Install
        run: |
          cd pipeline && uv sync && uv run playwright install --with-deps chromium
          cd ../web && npm ci

      - name: Test
        run: |
          cd pipeline && uv run pytest -q
          cd ../web && npm test

      - name: Fetch + compute
        run: |
          cd pipeline
          uv run python run.py fetch
          uv run python run.py compute --backfill "${{ github.event.inputs.backfill || '1' }}"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/cache
            web/public/data
          key: state-${{ github.run_id }}

      - name: Build + render
        run: |
          cd web && npm run build
          cd ../pipeline && uv run python render.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd web && npx --yes wrangler@4 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT || 'kwanmajaknai' }}" --branch main
